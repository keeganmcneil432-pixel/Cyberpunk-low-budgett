name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir www
          npm init -y
          npm i @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 three@0.128.0
          cp node_modules/three/build/three.min.js www/
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' night-city-fps-1.html > www/index.html
          echo '{"appId":"com.example.nightcityfps","appName":"Night City FPS","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1<item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
